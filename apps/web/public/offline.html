<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPLAT 04 — Signal lost</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 30%, #1b2f5c 0%, #060a14 70%), #060a14;
        color: #f2f6ff;
        font-family: 'Trebuchet MS', system-ui, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        font-family: 'Arial Black', Impact, sans-serif;
        font-style: italic;
        font-size: clamp(2.5rem, 14vw, 6rem);
        margin: 0;
        background: linear-gradient(to bottom, #fff, #b9c4d2 45%, #7b8798 52%, #fff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        max-width: 34rem;
        line-height: 1.6;
        opacity: 0.85;
      }
      .lime {
        color: #c8ff2f;
        letter-spacing: 0.3em;
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 0.8rem;
      }
      button {
        font-family: 'Arial Black', Impact, sans-serif;
        font-style: italic;
        text-transform: uppercase;
        font-size: 1rem;
        padding: 0.85rem 1.6rem;
        border: 2px solid #050a12;
        border-radius: 3px;
        color: #08111f;
        background: linear-gradient(to bottom, #a8ff6b, #c8ff2f 48%, #8fd400 52%, #d4ff8a);
        box-shadow: 0 4px 0 #0a1220;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>SPLAT 04</h1>
      <p class="lime">BROADCAST INTERRUPTED</p>
      <p>
        You are offline, so the arena cannot be reached. The estate is still there. The paint is
        still wet. Reconnect and the round will be waiting.
      </p>
      <button onclick="location.href='/'">Try again</button>
    </div>
  </body>
</html>
